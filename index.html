<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dailies</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #0b0c0f;
  }
  body { padding: 40px 16px; overflow-x: hidden; }
</style>
</head>
<body>
<div id="dl-root"></div>
<style>
  #dl-root {
    --bg: #14161a;
    --panel: #1c1f24;
    --panel-2: #23262d;
    --line: #33373e;
    --text: #f3f1ea;
    --muted: #9aa0ac;
    --teal: #2fd9c4;
    --teal-dim: #1c7f73;
    --amber: #f5a623;
    --amber-dim: #8a5d15;
    --coral: #ff6b5b;
    --radius: 10px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    border-radius: 16px;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
  }
  #dl-root * { box-sizing: border-box; }
  #dl-root .dl-topbar { padding: 28px 28px 20px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #191c21 0%, var(--bg) 100%); }
  #dl-root .dl-brand { display: flex; align-items: center; gap: 10px; }
  #dl-root .dl-mark { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, var(--amber), var(--coral)); color: #1a1200; font-weight: 800; font-size: 12px; }
  #dl-root h1 { font-size: 22px; font-weight: 800; letter-spacing: 1.5px; margin: 0; text-transform: uppercase; }
  #dl-root .dl-tagline { color: var(--muted); font-size: 13.5px; margin: 6px 0 0 40px; }
  #dl-root .dl-tabs { display: flex; gap: 4px; padding: 14px 28px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  #dl-root .dl-tab { background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.3px; padding: 10px 12px; cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase; white-space: nowrap; }
  #dl-root .dl-tab.active { color: var(--text); border-bottom-color: var(--amber); }
  #dl-root .dl-body { padding: 22px 28px 32px; }
  #dl-root .dl-field { margin-bottom: 14px; }
  #dl-root label.dl-label { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  #dl-root input[type=text], #dl-root select, #dl-root textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 13.5px; font-family: inherit;
  }
  #dl-root textarea { resize: vertical; min-height: 52px; }
  #dl-root .dl-row { display: flex; gap: 12px; }
  #dl-root .dl-row > div { flex: 1; }
  #dl-root .dl-lens-title { font-size: 11px; font-weight: 800; color: var(--amber); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 5px; }
  #dl-root .dl-btn { background: var(--amber); color: #1a1200; border: none; font-weight: 700; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  #dl-root .dl-btn.secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  #dl-root .dl-hint { color: var(--muted); font-size: 12px; }
  #dl-root .dl-empty { color: var(--muted); font-size: 13.5px; padding: 30px 0; text-align: center; }
  #dl-root .dl-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
  #dl-root .dl-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  #dl-root .dl-card-title { font-weight: 700; font-size: 14.5px; }
  #dl-root .dl-card-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #dl-root .dl-link { display: inline-block; margin-top: 6px; color: var(--teal); font-size: 12px; font-weight: 600; text-decoration: none; }
  #dl-root .dl-link:hover { text-decoration: underline; }
  #dl-root .dl-linkrow { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--teal); font-size: 12px; font-weight: 600; text-decoration: none; }
  #dl-root .dl-linkrow:hover { text-decoration: underline; }
  #dl-root .dl-favicon { width: 14px; height: 14px; border-radius: 3px; }
  #dl-root .dl-preview { width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: var(--panel-2); margin-bottom: 12px; position: relative; }
  #dl-root .dl-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #dl-root .dl-preview-video { aspect-ratio: auto; height: 0; }
  #dl-root .dl-preview-video iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  #dl-root .dl-preview-load { border: 1px dashed var(--line); color: var(--muted); cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 12.5px; font-weight: 600; }
  #dl-root .dl-preview-load:hover { border-color: var(--amber); color: var(--amber); }
  #dl-root .dl-play { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); font-size: 13px; }
  #dl-root .dl-pill { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 3px 8px; border-radius: 5px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  #dl-root .dl-lens-block { margin-top: 10px; font-size: 13px; line-height: 1.45; }
  #dl-root .dl-lens-block b { color: var(--teal); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; display: block; margin-bottom: 2px; }
  #dl-root .dl-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  #dl-root .dl-tag { font-size: 11px; background: var(--panel-2); color: var(--muted); padding: 3px 8px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; font-family: inherit; }
  #dl-root .dl-tag:hover { border-color: var(--teal); color: var(--teal); }
  #dl-root .dl-catrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  #dl-root .dl-catchip { font-size: 11.5px; font-weight: 600; background: var(--panel-2); color: var(--muted); padding: 5px 10px; border-radius: 14px; border: 1px solid var(--line); cursor: pointer; font-family: inherit; }
  #dl-root .dl-catchip.on { background: var(--amber-dim); border-color: var(--amber); color: #ffe8bf; }
  #dl-root .dl-del { background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; text-decoration: underline; }
  #dl-root .dl-edit { background: none; border: none; color: var(--teal); font-size: 11px; cursor: pointer; text-decoration: underline; }
  #dl-root .dl-card-actions { display: flex; gap: 16px; margin-top: 10px; }
  #dl-root .dl-search { margin-bottom: 16px; }
  #dl-root .dl-prompt-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; text-align: center; }
  #dl-root .dl-prompt-cat { font-size: 11px; font-weight: 800; color: var(--amber); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
  #dl-root .dl-prompt-text { font-size: 16px; line-height: 1.5; margin-bottom: 18px; }
  #dl-root .dl-prompt-actions { display: flex; gap: 10px; justify-content: center; }
  #dl-root .dl-reflect { margin-top: 16px; text-align: left; }
  #dl-root .dl-log-item { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  #dl-root .dl-log-item:last-child { border-bottom: none; }
  #dl-root .dl-log-date { color: var(--muted); font-size: 11px; }
  #dl-root .dl-stats-row { display: flex; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
  #dl-root .dl-stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; flex: 1; min-width: 120px; }
  #dl-root .dl-stat-num { font-size: 26px; font-weight: 800; color: var(--teal); }
  #dl-root .dl-stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }
  #dl-root .dl-cloud { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  #dl-root .dl-cloud span { color: var(--text); }
  #dl-root .dl-reset-row { margin-top: 30px; display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
  #dl-root .dl-loading { padding: 60px 28px; text-align: center; color: var(--muted); font-size: 13.5px; }
  #dl-root .dl-save-row { margin-top: 18px; display: flex; gap: 10px; align-items: center; }

  @media (max-width: 480px) {
    #dl-root .dl-topbar { padding: 20px 18px 16px; }
    #dl-root .dl-body { padding: 16px 18px 26px; }
    #dl-root .dl-tabs { padding: 10px 18px 0; }
    #dl-root .dl-tab { padding: 8px 8px; font-size: 11.5px; }
    #dl-root .dl-tagline { margin-left: 0; margin-top: 8px; }
    #dl-root .dl-row { flex-direction: column; gap: 0; }
    #dl-root .dl-stats-row { gap: 10px; }
    #dl-root .dl-stat { padding: 12px 14px; min-width: 100px; }
    #dl-root .dl-card { padding: 14px; }
    #dl-root .dl-save-row { flex-direction: column; align-items: stretch; text-align: center; }
    #dl-root .dl-reset-row { flex-direction: column; align-items: stretch; }
    #dl-root .dl-btn { width: 100%; }
  }
</style>
<script>
(function(){
  const STORAGE_KEY = "dailies:data";

  // Standalone replacement for the Claude.ai-only window.storage API.
  // Same async (key, useSync) => {value} shape, backed by localStorage.
  window.storage = {
    async get(key){
      let value = null;
      try { value = localStorage.getItem(key); } catch (e) {}
      return { value };
    },
    async set(key, value){
      localStorage.setItem(key, value);
    }
  };

  const PLATFORMS = ["TikTok","Instagram Reels","Instagram Feed / Carousel","YouTube Shorts","LinkedIn","Other"];
  const LENSES = [
    {key:"color", label:"Color & grade", placeholder:"e.g. Crushed blacks, warm skin tones, teal-leaning shadows — name the actual grading choices, not just \"nice colors.\""},
    {key:"motion", label:"Motion & pacing", placeholder:"e.g. Hard cuts on the beat, no crossfades, a whip-pan every 3rd shot — what's the edit rhythm doing?"},
    {key:"type", label:"Type & graphics", placeholder:"e.g. Kinetic captions that pop on stressed words, no drop shadows, hand-drawn arrows — what makes the type feel native, not templated?"},
    {key:"comp", label:"Composition & framing", placeholder:"e.g. Subject dead-center for thumbnail-ability, negative space left for captions — what is the framing choosing on purpose?"},
    {key:"sound", label:"Music & SFX", placeholder:"e.g. Bass hit lands exactly on the cut, foley crunch under the product reveal, music ducks out for the punchline — what's the audio actually doing?"}
  ];
  const CATEGORIES = ["Color & grade","Motion & pacing","Type & graphics","Composition & framing","Pacing & editing","Sound design","General"];
  const PROMPTS = [
    {cat:"Color", text:"Find one piece of content whose grade you'd never guess was 'default.' Name the two color decisions that make it feel intentional."},
    {cat:"Color", text:"Look at your last submission's grade. If a stranger described its mood in one word, what word would they use? Was that the word you wanted?"},
    {cat:"Motion", text:"Watch a top-performing native TikTok with the sound off. What is the cut pattern doing that a 'safe' corporate edit wouldn't do?"},
    {cat:"Motion", text:"Find a transition you admire. Recreate its timing (not its content) on a totally different clip today."},
    {cat:"Type", text:"Screenshot 3 on-brand graphics from your own recent work. If you removed the logo, would you still know which brand made it?"},
    {cat:"Type", text:"Find a caption/type treatment that feels platform-native rather than templated. What specifically breaks the template?"},
    {cat:"Composition", text:"Pick a still frame from your last edit. Would it work as a thumbnail with zero context? If not, what's missing?"},
    {cat:"Composition", text:"Find a reference where the framing itself creates rhythm across cuts, not just the content. Describe how."},
    {cat:"General", text:"Pick the platform you're weakest on. Watch 3 top posts back to back and write one sentence on what all 3 have in common visually."},
    {cat:"General", text:"Take a piece of feedback you've gotten before ('push the direction further'). Find one reference that nails the thing you were missing."},
    {cat:"General", text:"Describe your own visual style in 3 words. Would your leads use the same 3 words for your last submission?"},
    {cat:"General", text:"Find one edit that is technically simple but aesthetically confident. What is it choosing not to do?"}
  ];
  const STOPWORDS = new Set(["the","a","an","and","or","but","is","are","was","were","it","its","this","that","to","of","in","on","for","with","as","at","by","be","not","just","like","than","then","so","if","would","could","what","which","who","when","where","how","do","does","did","has","have","had","i","you","your","my","our","their","his","her","from","into","more","most","very","really","feel","feels","felt","makes","make","made","one","two","three"]);

  let data = null;
  let activeTab = "add";
  let editingId = null;
  let formPlatform = PLATFORMS[0];
  let formCategory = CATEGORIES[CATEGORIES.length-1];
  let searchQuery = "";
  let categoryFilter = "";
  let currentPrompt = PROMPTS[Math.floor(Math.random()*PROMPTS.length)];
  let showReflect = false;

  const root = document.getElementById("dl-root");

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  async function loadData(){
    try {
      const res = await window.storage.get(STORAGE_KEY, false);
      data = res && res.value ? JSON.parse(res.value) : { refs: [], practiceLog: [] };
    } catch (e) {
      data = { refs: [], practiceLog: [] };
    }
    render();
  }

  async function saveData(){
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(data), false);
    } catch (e) {
      console.error("Dailies: failed to save", e);
    }
  }

  function render(){
    if (data === null){
      root.innerHTML = '<div class="dl-loading">Loading your library…</div>';
      return;
    }
    root.innerHTML = `
      <div class="dl-topbar">
        <div class="dl-brand"><span class="dl-mark">DL</span><h1>Dailies</h1></div>
        <p class="dl-tagline">Study the work you admire until its choices become your instincts.</p>
      </div>
      <div class="dl-tabs">
        <button class="dl-tab ${activeTab==='add'?'active':''}" data-tab="add">Break Down a Reference</button>
        <button class="dl-tab ${activeTab==='library'?'active':''}" data-tab="library">Library</button>
        <button class="dl-tab ${activeTab==='practice'?'active':''}" data-tab="practice">Practice</button>
        <button class="dl-tab ${activeTab==='vocab'?'active':''}" data-tab="vocab">Vocabulary</button>
      </div>
      <div class="dl-body" id="dl-body"></div>
    `;
    root.querySelectorAll(".dl-tab").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        activeTab = btn.dataset.tab;
        if (activeTab === "add") editingId = null;
        render();
      });
    });
    const body = document.getElementById("dl-body");
    if (activeTab === "add") renderAdd(body);
    else if (activeTab === "library") renderLibrary(body);
    else if (activeTab === "practice") renderPractice(body);
    else renderVocab(body);
  }

  function renderAdd(body){
    const editing = editingId ? data.refs.find(r=>r.id===editingId) : null;
    const vals = editing || { title:"", url:"", thumbnail:"", why:"", lensText:{}, tags:[] };
    body.innerHTML = `
      ${editing ? '<div class="dl-hint" style="margin-bottom:14px;">Editing an existing entry.</div>' : ""}
      <div class="dl-field">
        <label class="dl-label">What is it</label>
        <input type="text" id="dl-title" placeholder="e.g. @brand's product drop teaser" value="${escapeAttr(vals.title)}">
      </div>
      <div class="dl-field">
        <label class="dl-label">Link (optional)</label>
        <input type="text" id="dl-url" placeholder="https://..." value="${escapeAttr(vals.url)}">
      </div>
      <div class="dl-field">
        <label class="dl-label">Preview image URL (optional)</label>
        <input type="text" id="dl-thumb" placeholder="Paste an image link if you have a screenshot hosted somewhere" value="${escapeAttr(vals.thumbnail)}">
        <div class="dl-hint" style="margin-top:5px;">If you skip this, the card just shows the site's icon and domain instead.</div>
      </div>
      <div class="dl-row">
        <div class="dl-field">
          <label class="dl-label">Platform</label>
          <select id="dl-platform">
            ${PLATFORMS.map(p=>`<option value="${p}" ${p===formPlatform?'selected':''}>${p}</option>`).join("")}
          </select>
        </div>
        <div class="dl-field">
          <label class="dl-label">Category</label>
          <select id="dl-category">
            ${CATEGORIES.map(c=>`<option value="${c}" ${c===formCategory?'selected':''}>${c}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="dl-field">
        <label class="dl-label">Why it's platform-native, not corporate, in one line</label>
        <input type="text" id="dl-why" placeholder="What makes this feel like it belongs on this platform" value="${escapeAttr(vals.why)}">
      </div>
      ${LENSES.map(l=>`
        <div class="dl-field">
          <div class="dl-lens-title">${l.label}</div>
          <textarea id="dl-lens-${l.key}" placeholder="${escapeAttr(l.placeholder)}">${escapeHtml((vals.lensText && vals.lensText[l.key]) || "")}</textarea>
        </div>
      `).join("")}
      <div class="dl-field">
        <label class="dl-label">Keywords (comma separated)</label>
        <input type="text" id="dl-tags" placeholder="e.g. desaturated, match cut, kinetic type" value="${escapeAttr((vals.tags||[]).join(', '))}">
        <div class="dl-hint" style="margin-top:5px;">These become clickable filters in your Library.</div>
      </div>
      <div class="dl-save-row">
        <button class="dl-btn" id="dl-save-btn">${editing ? "Save changes" : "Add to library"}</button>
        ${editing ? '<button class="dl-btn secondary" id="dl-cancel-edit">Cancel</button>' : '<span class="dl-hint">Be specific. Vague notes don\'t build an eye.</span>'}
      </div>
    `;
    document.getElementById("dl-platform").addEventListener("change",(e)=>{ formPlatform = e.target.value; });
    document.getElementById("dl-category").addEventListener("change",(e)=>{ formCategory = e.target.value; });
    document.getElementById("dl-save-btn").addEventListener("click", async ()=>{
      const title = document.getElementById("dl-title").value.trim() || "Untitled reference";
      let url = document.getElementById("dl-url").value.trim();
      if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;
      let thumbnail = document.getElementById("dl-thumb").value.trim();
      if (thumbnail && !/^https?:\/\//i.test(thumbnail)) thumbnail = "https://" + thumbnail;
      const why = document.getElementById("dl-why").value.trim();
      const tags = document.getElementById("dl-tags").value.split(",").map(t=>t.trim()).filter(Boolean);
      const lensText = {};
      LENSES.forEach(l=>{ lensText[l.key] = document.getElementById("dl-lens-"+l.key).value.trim(); });
      if (editing){
        Object.assign(editing, { title, url, thumbnail, category: formCategory, platform: formPlatform, why, lensText, tags });
      } else {
        const ref = { id: uid(), date: new Date().toISOString(), title, url, thumbnail, category: formCategory, platform: formPlatform, why, lensText, tags };
        data.refs.unshift(ref);
      }
      await saveData();
      editingId = null;
      activeTab = "library";
      render();
    });
    const cancelBtn = document.getElementById("dl-cancel-edit");
    if (cancelBtn){
      cancelBtn.addEventListener("click", ()=>{
        editingId = null;
        activeTab = "library";
        render();
      });
    }
  }

  function domainOf(url){
    try { return new URL(url).hostname.replace(/^www\./, ""); }
    catch(e){ return url; }
  }

  function getEmbedSrc(url){
    if (!url) return null;
    let m;
    if (m = url.match(/instagram\.com\/reel[s]?\/([^/?#]+)/i)){
      return { src: `https://www.instagram.com/reel/${m[1]}/embed`, ratio: "56.25%" };
    }
    if (m = url.match(/instagram\.com\/p\/([^/?#]+)/i)){
      return { src: `https://www.instagram.com/p/${m[1]}/embed`, ratio: "125%" };
    }
    if (m = url.match(/tiktok\.com\/@[^/]+\/video\/(\d+)/i)){
      return { src: `https://www.tiktok.com/embed/v2/${m[1]}`, ratio: "177.78%" };
    }
    if (m = url.match(/youtube\.com\/shorts\/([^/?#]+)/i)){
      return { src: `https://www.youtube.com/embed/${m[1]}`, ratio: "177.78%" };
    }
    if (m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?#]+)/i)){
      return { src: `https://www.youtube.com/embed/${m[1]}`, ratio: "56.25%" };
    }
    return null;
  }

  function renderLibrary(body){
    const q = searchQuery.toLowerCase();
    const filtered = data.refs.filter(r=>{
      if (categoryFilter && r.category !== categoryFilter) return false;
      if (!q) return true;
      const hay = [r.title, r.url, r.platform, r.category, r.why, ...(r.tags||[]), ...Object.values(r.lensText||{})].join(" ").toLowerCase();
      return hay.includes(q);
    });
    const usedCategories = CATEGORIES.filter(c=>data.refs.some(r=>r.category===c));
    body.innerHTML = `
      <div class="dl-field dl-search">
        <input type="text" id="dl-searchbox" placeholder="Search by keyword, platform, or category..." value="${escapeAttr(searchQuery)}">
      </div>
      ${usedCategories.length ? `
        <div class="dl-catrow">
          <button class="dl-catchip ${categoryFilter===''?'on':''}" data-cat="">All</button>
          ${usedCategories.map(c=>`<button class="dl-catchip ${categoryFilter===c?'on':''}" data-cat="${escapeAttr(c)}">${c}</button>`).join("")}
        </div>
      ` : ""}
      <div id="dl-lib-list">
        ${filtered.length === 0 ? '<div class="dl-empty">No references logged yet. Start with one thing you saw today that stopped your scroll.</div>' :
          filtered.map(r=>{
            const dateStr = new Date(r.date).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
            const domain = r.url ? domainOf(r.url) : "";
            const favicon = domain ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64` : "";
            const embed = getEmbedSrc(r.url);
            let previewBlock = "";
            if (embed){
              previewBlock = `
                <div class="dl-preview dl-preview-video" style="aspect-ratio:auto; padding-top:${embed.ratio};">
                  <iframe src="${escapeAttr(embed.src)}" loading="lazy" frameborder="0"
                    allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen
                    sandbox="allow-scripts allow-same-origin allow-popups allow-presentation"
                    title="Reference preview"></iframe>
                </div>`;
            } else if (r.thumbnail){
              previewBlock = `<div class="dl-preview"><img src="${escapeAttr(r.thumbnail)}" alt="" onerror="this.parentElement.style.display='none'"></div>`;
            }
            return `
              <div class="dl-card">
                ${previewBlock}
                <div class="dl-card-head">
                  <div style="min-width:0;">
                    <div class="dl-card-title">${escapeHtml(r.title)}</div>
                    <div class="dl-card-sub">${r.platform} &middot; ${dateStr}</div>
                    ${r.url ? `
                      <a href="${escapeAttr(r.url)}" target="_blank" rel="noopener noreferrer" class="dl-linkrow">
                        ${favicon ? `<img src="${favicon}" class="dl-favicon" alt="">` : ""}
                        <span>${escapeHtml(domain)} ↗</span>
                      </a>
                    ` : ""}
                  </div>
                  ${r.category ? `<span class="dl-pill">${escapeHtml(r.category)}</span>` : ""}
                </div>
                ${r.why ? `<div class="dl-card-sub" style="margin-top:8px; font-style:italic;">${escapeHtml(r.why)}</div>` : ""}
                ${LENSES.filter(l=>r.lensText && r.lensText[l.key]).map(l=>`
                  <div class="dl-lens-block"><b>${l.label}</b>${escapeHtml(r.lensText[l.key])}</div>
                `).join("")}
                ${(r.tags && r.tags.length) ? `<div class="dl-tags">${r.tags.map(t=>`<button class="dl-tag" data-kw="${escapeAttr(t)}">${escapeHtml(t)}</button>`).join("")}</div>` : ""}
                <div class="dl-card-actions">
                  <button class="dl-edit" data-edit="${r.id}">Edit this entry</button>
                  <button class="dl-del" data-del="${r.id}">Delete this entry</button>
                </div>
              </div>
            `;
          }).join("")}
      </div>
    `;
    document.getElementById("dl-searchbox").addEventListener("input",(e)=>{ searchQuery = e.target.value; render(); });
    body.querySelectorAll(".dl-catchip").forEach(btn=>{
      btn.addEventListener("click", ()=>{ categoryFilter = btn.dataset.cat; render(); });
    });
    body.querySelectorAll("[data-kw]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ searchQuery = btn.dataset.kw; render(); });
    });
    body.querySelectorAll("[data-del]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        data.refs = data.refs.filter(r=>r.id!==btn.dataset.del);
        await saveData();
        render();
      });
    });
    body.querySelectorAll("[data-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const r = data.refs.find(x=>x.id===btn.dataset.edit);
        if (!r) return;
        editingId = r.id;
        formPlatform = r.platform;
        formCategory = r.category;
        activeTab = "add";
        render();
      });
    });
  }

  function renderPractice(body){
    body.innerHTML = `
      <div class="dl-prompt-card">
        <div class="dl-prompt-cat">${currentPrompt.cat}</div>
        <div class="dl-prompt-text">${currentPrompt.text}</div>
        <div class="dl-prompt-actions">
          <button class="dl-btn secondary" id="dl-shuffle">Different prompt</button>
          <button class="dl-btn" id="dl-done">I did this</button>
        </div>
        ${showReflect ? `
          <div class="dl-reflect">
            <label class="dl-label">One line on what you noticed</label>
            <textarea id="dl-reflection" placeholder="Keep it short and specific"></textarea>
            <div class="dl-save-row"><button class="dl-btn" id="dl-save-reflect">Log it</button></div>
          </div>
        ` : ""}
      </div>
      <div style="margin-top:26px;">
        <div class="dl-lens-title" style="color:var(--muted); margin-bottom:10px;">Practice log</div>
        ${data.practiceLog.length === 0 ? '<div class="dl-empty">Nothing logged yet.</div>' :
          data.practiceLog.slice(0,10).map(p=>`
            <div class="dl-log-item">
              <div class="dl-log-date">${new Date(p.date).toLocaleDateString(undefined,{month:"short",day:"numeric"})} &middot; ${p.cat}</div>
              <div>${escapeHtml(p.reflection || p.prompt)}</div>
            </div>
          `).join("")}
      </div>
    `;
    document.getElementById("dl-shuffle").addEventListener("click", ()=>{
      let next = currentPrompt;
      while (next === currentPrompt && PROMPTS.length > 1){
        next = PROMPTS[Math.floor(Math.random()*PROMPTS.length)];
      }
      currentPrompt = next;
      showReflect = false;
      render();
    });
    document.getElementById("dl-done").addEventListener("click", ()=>{
      showReflect = true;
      render();
    });
    const saveBtn = document.getElementById("dl-save-reflect");
    if (saveBtn){
      saveBtn.addEventListener("click", async ()=>{
        const reflection = document.getElementById("dl-reflection").value.trim();
        data.practiceLog.unshift({ id: uid(), date: new Date().toISOString(), cat: currentPrompt.cat, prompt: currentPrompt.text, reflection });
        await saveData();
        showReflect = false;
        currentPrompt = PROMPTS[Math.floor(Math.random()*PROMPTS.length)];
        render();
      });
    }
  }

  function renderVocab(body){
    const counts = {};
    const addText = (str)=>{
      if (!str) return;
      str.toLowerCase().split(/[^a-z'-]+/).forEach(w=>{
        if (w.length < 4) return;
        if (STOPWORDS.has(w)) return;
        counts[w] = (counts[w]||0) + 1;
      });
    };
    data.refs.forEach(r=>{
      addText(r.why);
      LENSES.forEach(l=> addText(r.lensText && r.lensText[l.key]));
      (r.tags||[]).forEach(t=> addText(t));
    });
    data.practiceLog.forEach(p=> addText(p.reflection));

    const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,30);
    const maxCount = entries.length ? entries[0][1] : 1;
    const totalUnique = Object.keys(counts).length;

    body.innerHTML = `
      <div class="dl-stats-row">
        <div class="dl-stat"><div class="dl-stat-num">${data.refs.length}</div><div class="dl-stat-label">References broken down</div></div>
        <div class="dl-stat"><div class="dl-stat-num">${data.practiceLog.length}</div><div class="dl-stat-label">Practice reps logged</div></div>
        <div class="dl-stat"><div class="dl-stat-num">${totalUnique}</div><div class="dl-stat-label">Distinct terms in your vocabulary</div></div>
      </div>
      <div class="dl-lens-title" style="color:var(--muted); margin-bottom:12px;">Your recurring visual vocabulary</div>
      <div class="dl-cloud">
        ${entries.length === 0 ? '<div class="dl-empty">Log a few breakdowns and this fills in on its own.</div>' :
          entries.map(([word,count])=>{
            const size = 12 + (count/maxCount)*16;
            const opacity = 0.55 + (count/maxCount)*0.45;
            return `<span style="font-size:${size.toFixed(0)}px; color: var(--text); opacity:${opacity.toFixed(2)};" title="${count}×">${escapeHtml(word)}</span>`;
          }).join("")}
      </div>
      <div class="dl-hint" style="margin-top:14px;">The more specific and varied these words get over time, the more precisely you're seeing what makes work land, and the easier it is to direct toward it on purpose.</div>
      <div class="dl-reset-row">
        <button class="dl-btn secondary" id="dl-export">Export data</button>
        <button class="dl-btn secondary" id="dl-import-btn">Import data</button>
        <input type="file" id="dl-import-file" accept="application/json" style="display:none;">
        <button class="dl-btn secondary" id="dl-reset">Clear all data</button>
      </div>
    `;
    document.getElementById("dl-reset").addEventListener("click", async ()=>{
      if (confirm("Clear all references and practice logs? This can't be undone.")){
        data = { refs: [], practiceLog: [] };
        await saveData();
        render();
      }
    });
    document.getElementById("dl-export").addEventListener("click", ()=>{
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `dailies-backup-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
    const importBtn = document.getElementById("dl-import-btn");
    const importFile = document.getElementById("dl-import-file");
    importBtn.addEventListener("click", ()=> importFile.click());
    importFile.addEventListener("change", (e)=>{
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async ()=>{
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed || !Array.isArray(parsed.refs) || !Array.isArray(parsed.practiceLog)) throw new Error("bad format");
          if (confirm("Import will replace your current library and practice log. Continue?")){
            data = { refs: parsed.refs, practiceLog: parsed.practiceLog };
            await saveData();
            render();
          }
        } catch(err){
          alert("Couldn't read that file — make sure it's a Dailies export.");
        }
        importFile.value = "";
      };
      reader.readAsText(file);
    });
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }
  function escapeAttr(str){ return escapeHtml(str).replace(/"/g,"&quot;"); }

  loadData();
})();
</script>
</body>
</html>
